<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width:400px;">
  <h3 class="mb-3">Sign Up</h3>

  <input class="form-control mb-2" id="name" placeholder="Name">
  <input class="form-control mb-2" id="email" placeholder="Email">
  <input type="date" class="form-control mb-2" id="birth_date">
  <input type="password" class="form-control mb-3" id="password" placeholder="Password">

  <button id="registerBtn" class="btn btn-success w-100">Register</button>
  <div id="error" class="text-danger mt-3"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
