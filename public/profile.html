<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width:500px;">
  <h3 class="mb-3">Profile</h3>

  <input class="form-control mb-2" id="name">
  <input class="form-control mb-2" id="email" disabled>
  <input type="date" class="form-control mb-2" id="birth_date">
  <input type="password" class="form-control mb-3" id="password" placeholder="New password">

  <button id="updateBtn" class="btn btn-primary w-100 mb-2">Update Profile</button>
  <button id="logoutBtn" class="btn btn-secondary w-100 mb-2">Logout</button>
  <button id="deleteBtn" class="btn btn-danger w-100">Delete Account</button>

  <div id="msg" class="mt-3"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
